<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="45%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <path d="M0 90 H1280 M0 180 H1280 M0 270 H1280"/>
    <path d="M160 0 V360 M320 0 V360 M480 0 V360 M640 0 V360 M800 0 V360 M960 0 V360 M1120 0 V360"/>
  </g>

  <!-- terminal prompt -->
  <text x="80" y="96" font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="20" fill="#22d3ee">
    <tspan fill="#64748b">joe@build:~$</tspan> <tspan fill="#e2e8f0">./ship --idea --to production</tspan><tspan fill="#38bdf8">_</tspan>
  </text>

  <!-- name -->
  <text x="78" y="176" font-size="66" font-weight="800" fill="#f8fafc" letter-spacing="1">JoeBuildsAI</text>
  <text x="82" y="216" font-size="24" font-weight="600" fill="#94a3b8">Joseph Wilkinson · Legal-Tech Architect &amp; AI Builder</text>

  <!-- pipeline -->
  <g font-size="22" font-weight="700">
    <text x="80"  y="300" fill="#38bdf8">Ideas</text>
    <text x="205" y="300" fill="url(#fade)">&#8594;</text>
    <text x="245" y="300" fill="#818cf8">Code</text>
    <text x="355" y="300" fill="url(#fade)">&#8594;</text>
    <text x="395" y="300" fill="#22d3ee">Real World</text>
    <text x="565" y="300" fill="url(#fade)">&#8594;</text>
    <text x="605" y="300" fill="#a78bfa">Impact</text>
  </g>

  <!-- accent bar -->
  <rect x="80" y="322" width="640" height="4" rx="2" fill="url(#accent)"/>

  <!-- decorative code block, right side -->
  <g font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="16" opacity="0.9">
    <rect x="812" y="70" width="388" height="220" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <circle cx="836" cy="92" r="6" fill="#f87171"/>
    <circle cx="856" cy="92" r="6" fill="#fbbf24"/>
    <circle cx="876" cy="92" r="6" fill="#34d399"/>
    <text x="832" y="132" fill="#c084fc">while <tspan fill="#e2e8f0">(</tspan><tspan fill="#38bdf8">awake</tspan><tspan fill="#e2e8f0">) {</tspan></text>
    <text x="856" y="160" fill="#e2e8f0">automate(<tspan fill="#fbbf24">lawyers</tspan>);</text>
    <text x="856" y="184" fill="#e2e8f0">train(<tspan fill="#fbbf24">models</tspan>);</text>
    <text x="856" y="208" fill="#e2e8f0">build(<tspan fill="#fbbf24">roguelite</tspan>);</text>
    <text x="856" y="232" fill="#64748b">// one last edge case</text>
    <text x="832" y="260" fill="#e2e8f0">}</text>
  </g>
</svg>
